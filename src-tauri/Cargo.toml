[package]
name = "keyfold-app"
description = "A fast desktop client for Redis and Valkey"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "keyfold_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `tauri build` enables this; a plain `cargo build --release` without it
# still loads the Vite dev server instead of the bundled frontend.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tempfile = "3"
keyfold-core.workspace = true
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1", features = ["v4"] }
# OS keychain (Keychain Services, Credential Manager, Secret Service)
keyring = "4"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# same gtk the Tauri runtime links; used for the window size round trip
gtk = "0.18"
