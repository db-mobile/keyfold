[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["Dennis Blümer <dennis.bluemer@ducart.de>"]
repository = "https://github.com/db-mobile/keyfold"

[workspace.dependencies]
keyfold-core = { path = "crates/core" }
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "tokio-rustls-comp"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
rand = "0.9"
regex = "1"

[profile.release]
debug = 1
